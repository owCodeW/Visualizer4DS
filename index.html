<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Visualizer4DS - 持久化工具数据结构可视化学习平台</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/css/index.css">
</head>
<body>
    <div class="home-hero">
        <h1>DS Visualizer</h1>
        <p>多分类数据结构可视化学习平台 — 操作 → 编码切换 → 结构变化 全程交互式展示</p>
        <div class="home-stats" id="homeStats">
            <span class="stat-pill"><strong id="statCategories">0</strong> 个分类</span>
            <span class="stat-pill"><strong id="statTypes">0</strong> 个数据类型</span>
            <span class="stat-pill"><strong id="statPlanned">0</strong> 规划中</span>
        </div>
    </div>

    <div id="categoryList">
        <!-- 由 JS 动态渲染 -->
    </div>

    <div class="category-section" style="text-align:center;background:linear-gradient(135deg,#fef3c7 0%,#fed7aa 100%);">
        <div style="font-size:14px;color:#92400e;">
            💡 <strong>拓展提示</strong>: 在 <code>categories/</code> 下新建子包 + 调用 <code>register_category</code> 即可加入新分类<br>
            参考: <code>categories/redis/__init__.py</code> · <code>categories/registry.py</code>
        </div>
    </div>

    <script src="/static/api.js"></script>
    <script src="/static/js/index.js"></script>
</body>
</html>
