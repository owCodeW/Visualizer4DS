<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Visualizer4DS - 持久化工具数据结构可视化学习平台</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* 主页专用样式 */
        .home-hero {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            color: #fff;
            padding: 30px 40px;
            border-radius: 12px;
            margin: 0 auto 30px;
            max-width: 1200px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .home-hero h1 {
            margin: 0 0 8px 0;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(90deg, #fbbf24, #f87171, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .home-hero p {
            margin: 0;
            color: #cbd5e1;
            font-size: 14px;
        }
        .home-stats {
            display: flex;
            gap: 16px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .stat-pill {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #e2e8f0;
        }
        .stat-pill strong {
            color: #fbbf24;
            margin-right: 4px;
        }

        /* 分类板块 */
        .category-section {
            max-width: 1200px;
            margin: 0 auto 32px;
            background: #fff;
            border-radius: 12px;
            padding: 24px 28px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .category-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 2px solid #f1f5f9;
        }
        .category-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }
        .category-title-block {
            flex: 1;
        }
        .category-name {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin: 0 0 2px 0;
        }
        .category-version {
            font-size: 11px;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
        }
        .category-desc {
            font-size: 13px;
            color: #64748b;
            margin: 0;
        }
        .category-status {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
        }
        .status-active { background: #dcfce7; color: #166534; }
        .status-planned { background: #fef3c7; color: #92400e; }

        /* 类型卡片 */
        .type-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 14px;
        }
        .type-card {
            display: block;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            text-decoration: none;
            color: inherit;
            transition: all 0.2s ease;
            position: relative;
            background: #fff;
        }
        .type-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            border-color: #cbd5e1;
        }
        .type-card.disabled {
            opacity: 0.55;
            cursor: not-allowed;
            background: #f8fafc;
        }
        .type-card.disabled:hover {
            transform: none;
            box-shadow: none;
        }
        .type-card-icon {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .type-card-name {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .type-card-desc {
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 10px;
            min-height: 36px;
        }
        .type-card-encodings {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            align-items: center;
            font-size: 11px;
        }
        .enc-tag {
            padding: 2px 7px;
            border-radius: 3px;
            font-family: Consolas, monospace;
            font-weight: 600;
        }
        .enc-arrow { color: #dc2626; font-weight: bold; }

        /* 占位卡片 (planned) */
        .type-card-placeholder {
            border: 1px dashed #cbd5e1;
            background: #f8fafc;
            color: #94a3b8;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            font-size: 13px;
        }

        /* 规划中分类 */
        .planned-types-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
            margin-top: 4px;
        }
        .planned-type {
            background: #f1f5f9;
            color: #475569;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-family: Consolas, monospace;
        }
    </style>
</head>
<body>
    <div class="home-hero">
        <h1>DS Visualizer</h1>
        <p>多分类数据结构可视化学习平台 — 操作 → 编码切换 → 结构变化 全程交互式展示</p>
        <div class="home-stats" id="homeStats">
            <span class="stat-pill"><strong id="statCategories">0</strong> 个分类</span>
            <span class="stat-pill"><strong id="statTypes">0</strong> 个数据类型</span>
            <span class="stat-pill"><strong id="statPlanned">0</strong> 规划中</span>
        </div>
    </div>

    <div id="categoryList">
        <!-- 由 JS 动态渲染 -->
    </div>

    <div class="category-section" style="text-align:center;background:linear-gradient(135deg,#fef3c7 0%,#fed7aa 100%);">
        <div style="font-size:14px;color:#92400e;">
            💡 <strong>拓展提示</strong>: 在 <code>categories/</code> 下新建子包 + 调用 <code>register_category</code> 即可加入新分类<br>
            参考: <code>categories/redis/__init__.py</code> · <code>categories/registry.py</code>
        </div>
    </div>

    <script src="/static/api.js"></script>
    <script>
        // 编码标签配色 (与各类型 encodings 对应)
        const ENC_COLORS = {
            // Redis
            'int':        '#a78bfa',
            'embstr':     '#10b981',
            'raw':        '#ef4444',
            'listpack':   '#06b6d4',
            'quicklist':  '#3b82f6',
            'hashtable':  '#f59e0b',
            'int16':      '#fbbf24',
            'int32':      '#fb923c',
            'int64':      '#f97316',
            'skiplist':   '#dc2626',
            // 缓存三大问题
            'penetration': '#f97316',
            'breakdown':   '#eab308',
            'avalanche':   '#3b82f6',
        };

        // 渲染编码标签 + 箭头
        function renderEncodings(encodings) {
            if (!encodings || encodings.length === 0) return '';
            const parts = [];
            encodings.forEach((enc, i) => {
                if (i > 0) parts.push('<span class="enc-arrow">→</span>');
                const color = ENC_COLORS[enc] || '#94a3b8';
                parts.push(`<span class="enc-tag" style="background:${color};color:#fff;">${enc}</span>`);
            });
            return parts.join('');
        }

        // 渲染单个分类板块
        function renderCategory(cat) {
            const activeTypes = cat.types.filter(t => t.status === 'active');
            const plannedTypes = cat.types.filter(t => t.status !== 'active');
            const status = activeTypes.length > 0
                ? `<span class="category-status status-active">● ${activeTypes.length} 已上线</span>`
                : `<span class="category-status status-planned">○ 规划中</span>`;

            const typesHtml = cat.types.map(t => {
                const isActive = t.status === 'active' && t.page_path;
                if (!isActive) {
                    return `<div class="type-card-placeholder">${t.name}<br><span style="font-size:11px;">(规划中)</span></div>`;
                }
                return `
                    <a class="type-card" href="${t.page_path}">
                        <div class="type-card-icon" style="background:${t.color || cat.color};">${t.icon || t.name[0]}</div>
                        <div class="type-card-name">${t.name}</div>
                        <div class="type-card-desc">${t.description}</div>
                        <div class="type-card-encodings">${renderEncodings(t.encodings)}</div>
                    </a>
                `;
            }).join('');

            return `
                <div class="category-section">
                    <div class="category-header">
                        <div class="category-icon" style="background:${cat.color};">${cat.icon || cat.name[0].toUpperCase()}</div>
                        <div class="category-title-block">
                            <h2 class="category-name">
                                ${cat.display_name}
                                <span class="category-version">${cat.version || ''}</span>
                            </h2>
                            <p class="category-desc">${cat.description}</p>
                        </div>
                        ${status}
                    </div>
                    <div class="type-cards">${typesHtml}</div>
                </div>
            `;
        }

        // 加载并渲染
        async function loadHome() {
            try {
                const data = await CategoryAPI.list();
                const container = document.getElementById('categoryList');
                container.innerHTML = data.categories.map(renderCategory).join('');

                // 统计
                const totalTypes = data.categories.reduce((s, c) => s + c.types.length, 0);
                const totalPlanned = data.categories.reduce(
                    (s, c) => s + c.types.filter(t => t.status !== 'active').length, 0);
                document.getElementById('statCategories').textContent = data.categories.length;
                document.getElementById('statTypes').textContent = totalTypes;
                document.getElementById('statPlanned').textContent = totalPlanned;
            } catch (e) {
                document.getElementById('categoryList').innerHTML =
                    `<div class="category-section" style="color:#dc2626;">加载失败: ${e.message}</div>`;
            }
        }

        loadHome();
    </script>
</body>
</html>
