<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MySQL InnoDB 写入流程 | 内存&磁盘 前后状态对比动画</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Microsoft Yahei", sans-serif;
}
body {
  background: #f5f7fa;
  padding: 20px;
}
.container {
  max-width: 1280px;
  margin: 0 auto;
  background: #fff;
  padding: 24px;
  border-radius: 10px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.1);
}
h1 {
  text-align: center;
  color: #1f2937;
  margin-bottom: 20px;
  font-size: 22px;
}
.top-desc {
  text-align: center;
  color: #666;
  margin-bottom: 16px;
  height: 36px;
  line-height: 36px;
  font-size: 15px;
}

/* 分区布局 */
.wrapper {
  display: flex;
  gap: 20px;
  margin-bottom: 20px;
}
.memory-area, .disk-area {
  flex: 1;
  border: 2px solid #409eff;
  border-radius: 8px;
  padding: 16px;
  background: #f0f7ff;
  min-height: 480px;
}
.disk-area {
  border-color: #67c23a;
  background: #f4fcf0;
}
.area-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 16px;
  padding-bottom: 8px;
  border-bottom: 1px dashed #ccc;
}
.module {
  border: 1px solid #999;
  border-radius: 6px;
  padding: 12px;
  margin-bottom: 14px;
  background: #fff;
  transition: all 0.3s ease;
}
.module.active {
  border-color: #e64340;
  background: #ffe9e9;
  transform: scale(1.02);
}
.module-title {
  font-weight: bold;
  margin-bottom: 8px;
  font-size: 14px;
  color: #333;
}
.content {
  font-size: 14px;
  line-height: 1.8;
  color: #444;
}
.highlight {
  color: #e64340;
  font-weight: bold;
}
.tag {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 12px;
  margin-left: 6px;
  color: #fff;
}
.tag-prepare {
  background: #e6a23c;
}
.tag-commit {
  background: #67c23a;
}
.tag-dirty {
  background: #9c88ff;
}

/* 宕机提示 */
.crash-alert {
  background: #f56c6c;
  color: #fff;
  padding: 8px 12px;
  border-radius: 4px;
  margin: 10px 0;
  display: none;
  font-weight: bold;
}

/* 流程说明 */
.step-desc {
  background: #2c3e50;
  color: #fff;
  padding: 14px;
  border-radius: 6px;
  font-size: 14px;
  line-height: 1.7;
  margin-bottom: 16px;
}

/* 按钮 */
.btn-group {
  text-align: center;
}
button {
  padding: 9px 22px;
  margin: 0 10px;
  border: none;
  border-radius: 4px;
  background: #409eff;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
button:hover {
  opacity: 0.9;
}
</style>
</head>
<body>
<div class="container">
  <h1>MySQL InnoDB 写入流程 | 内存 & 磁盘 完整状态变化</h1>
  <div class="top-desc" id="statusText">初始状态：SQL 未执行，所有数据/日志为原始值</div>

  <div class="wrapper">
    <!-- 左侧：内存区域 -->
    <div class="memory-area">
      <div class="area-title">🔹 内存区域</div>
      <div class="module" id="undoMem">
        <div class="module-title">Undo 缓冲区</div>
        <div class="content" id="undoContent">暂无数据</div>
      </div>
      <div class="module" id="bufferPool">
        <div class="module-title">Buffer Pool 缓冲池</div>
        <div class="content" id="poolContent">id=1, c=10</div>
      </div>
      <div class="module" id="redoMem">
        <div class="module-title">Redo Log Buffer</div>
        <div class="content" id="redoMemContent">暂无日志</div>
      </div>
      <div class="module" id="binMem">
        <div class="module-title">Binlog Cache</div>
        <div class="content" id="binMemContent">暂无日志</div>
      </div>
    </div>

    <!-- 右侧：磁盘区域 -->
    <div class="disk-area">
      <div class="area-title">🔸 磁盘区域</div>
      <div class="module" id="redoDisk">
        <div class="module-title">Redo Log 磁盘文件</div>
        <div class="content" id="redoDiskContent">暂无日志</div>
      </div>
      <div class="module" id="binDisk">
        <div class="module-title">Binlog 磁盘文件</div>
        <div class="content" id="binDiskContent">暂无日志</div>
      </div>
      <div class="module" id="dataDisk">
        <div class="module-title">物理数据磁盘</div>
        <div class="content" id="dataDiskContent">id=1, c=10</div>
      </div>
    </div>
  </div>

  <div class="crash-alert" id="crashTip">⚠️ 当前阶段发生宕机</div>
  <div class="step-desc" id="stepDesc">
    【初始状态】未执行 UPDATE 语句。<br>
    原始数据：id=1，c=10；所有日志缓冲区、磁盘日志均为空。
  </div>

  <div class="btn-group">
    <button id="nextBtn">下一步</button>
    <button id="resetBtn">重置状态</button>
  </div>
</div>

<script>
// DOM 节点
const statusText = document.getElementById('statusText');
const stepDesc = document.getElementById('stepDesc');
const crashTip = document.getElementById('crashTip');

// 内存模块
const undoMem = document.getElementById('undoMem');
const undoContent = document.getElementById('undoContent');
const bufferPool = document.getElementById('bufferPool');
const poolContent = document.getElementById('poolContent');
const redoMem = document.getElementById('redoMem');
const redoMemContent = document.getElementById('redoMemContent');
const binMem = document.getElementById('binMem');
const binMemContent = document.getElementById('binMemContent');

// 磁盘模块
const redoDisk = document.getElementById('redoDisk');
const redoDiskContent = document.getElementById('redoDiskContent');
const binDisk = document.getElementById('binDisk');
const binDiskContent = document.getElementById('binDiskContent');
const dataDisk = document.getElementById('dataDisk');
const dataDiskContent = document.getElementById('dataDiskContent');

const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');

// 完整步骤：0=初始状态，1~5=执行流程
const stepList = [
  // 步骤0：【修改前 原始状态】
  {
    title: '阶段0：修改前 - 原始初始状态',
    desc: '未执行任何写入SQL，数据、日志均为出厂原始状态。<br>原始数据：id=1，c=10；所有内存缓冲区、磁盘日志无内容。',
    crash: false,
    active: [],
    undo: '暂无数据',
    pool: 'id=1, c=10',
    redoMem: '暂无日志',
    binMem: '暂无日志',
    redoDisk: '暂无日志',
    binDisk: '暂无日志',
    dataDisk: 'id=1, c=10'
  },
  // 步骤1：写入Undo
  {
    title: '阶段1：写入 Undo 缓冲区（备份旧数据）',
    desc: '执行UPDATE前，先把旧数据写入Undo内存，用于回滚与MVCC。<br>【宕机后果】仅内存写入，磁盘无变更，重启事务丢弃，数据保持原值 c=10。',
    crash: true,
    active: [undoMem],
    undo: '旧数据备份：id=1, c=10 <span class="highlight">新增</span>',
    pool: 'id=1, c=10',
    redoMem: '暂无日志',
    binMem: '暂无日志',
    redoDisk: '暂无日志',
    binDisk: '暂无日志',
    dataDisk: 'id=1, c=10'
  },
  // 步骤2：修改内存 + Redo Prepare落盘
  {
    title: '阶段2：修改缓冲池 + Redo 刷盘(PREPARE)',
    desc: 'Buffer Pool 数据更新，产生脏页；Redo写入内存并强制落盘，标记PREPARE。<br>【宕机后果】Redo已落盘、Binlog为空，重启执行Undo回滚，数据恢复 c=10。',
    crash: true,
    active: [bufferPool, redoMem, redoDisk],
    undo: '旧数据备份：id=1, c=10',
    pool: 'id=1, c=11 <span class="tag tag-dirty">脏页</span> <span class="highlight">已修改</span>',
    redoMem: '物理日志：c = c + 1 <span class="highlight">新增</span>',
    binMem: '暂无日志',
    redoDisk: '物理日志：c = c + 1 <span class="tag tag-prepare">PREPARE</span> <span class="highlight">磁盘落盘</span>',
    binDisk: '暂无日志',
    dataDisk: 'id=1, c=10'
  },
  // 步骤3：Binlog 内存+磁盘落盘
  {
    title: '阶段3：Binlog 写入缓存并刷入磁盘',
    desc: 'Server层生成逻辑Binlog，先写入内存缓存，再强制刷到磁盘。<br>【宕机后果】Binlog已落盘、Redo仍为PREPARE，重启自动补提交，数据 c=11 生效。',
    crash: true,
    active: [binMem, binDisk],
    undo: '旧数据备份：id=1, c=10',
    pool: 'id=1, c=11 <span class="tag tag-dirty">脏页</span>',
    redoMem: '物理日志：c = c + 1',
    binMem: '逻辑日志：UPDATE t SET c=c+1 WHERE id=1 <span class="highlight">新增</span>',
    redoDisk: '物理日志：c = c + 1 <span class="tag tag-prepare">PREPARE</span>',
    binDisk: '逻辑日志：UPDATE t SET c=c+1 WHERE id=1 <span class="highlight">磁盘落盘</span>',
    dataDisk: 'id=1, c=10'
  },
  // 步骤4：Redo 标记Commit
  {
    title: '阶段4：Redo 标记 COMMIT，事务提交',
    desc: 'Binlog落盘完成，修改Redo状态为COMMIT，事务正式提交，客户端收到成功响应。',
    crash: false,
    active: [redoDisk],
    undo: '旧数据备份：id=1, c=10',
    pool: 'id=1, c=11 <span class="tag tag-dirty">脏页</span>',
    redoMem: '物理日志：c = c + 1',
    binMem: '逻辑日志：UPDATE t SET c=c+1 WHERE id=1',
    redoDisk: '物理日志：c = c + 1 <span class="tag tag-commit">COMMIT</span> <span class="highlight">状态更新</span>',
    binDisk: '逻辑日志：UPDATE t SET c=c+1 WHERE id=1',
    dataDisk: 'id=1, c=10'
  },
  // 步骤5：异步刷脏页到数据磁盘
  {
    title: '阶段5：后台异步刷脏页，数据最终落盘',
    desc: '脏页由后台线程异步刷入物理磁盘，数据永久持久化。<br>【宕机后果】所有日志已落盘，重启重放Redo恢复数据，最终保持 c=11。',
    crash: true,
    active: [dataDisk],
    undo: '旧数据备份：id=1, c=10',
    pool: 'id=1, c=11',
    redoMem: '物理日志：c = c + 1',
    binMem: '逻辑日志：UPDATE t SET c=c+1 WHERE id=1',
    redoDisk: '物理日志：c = c + 1 <span class="tag tag-commit">COMMIT</span>',
    binDisk: '逻辑日志：UPDATE t SET c=c+1 WHERE id=1',
    dataDisk: 'id=1, c=11 <span class="highlight">最终持久化</span>'
  }
];

let currentStep = 0;

// 清空高亮
function clearActive() {
  document.querySelectorAll('.module').forEach(el => {
    el.classList.remove('active');
  });
  crashTip.style.display = 'none';
}

// 渲染当前步骤
function renderStep(idx) {
  clearActive();
  const s = stepList[idx];

  statusText.innerText = s.title;
  stepDesc.innerHTML = s.desc;
  crashTip.style.display = s.crash ? 'block' : 'none';

  // 模块高亮
  s.active.forEach(el => el.classList.add('active'));

  // 刷新所有内容
  undoContent.innerHTML = s.undo;
  poolContent.innerHTML = s.pool;
  redoMemContent.innerHTML = s.redoMem;
  binMemContent.innerHTML = s.binMem;
  redoDiskContent.innerHTML = s.redoDisk;
  binDiskContent.innerHTML = s.binDisk;
  dataDiskContent.innerHTML = s.dataDisk;
}

// 下一步
nextBtn.addEventListener('click', () => {
  if (currentStep < stepList.length - 1) {
    currentStep++;
    renderStep(currentStep);
  } else {
    statusText.innerText = '全部流程演示完成';
  }
});

// 重置
resetBtn.addEventListener('click', () => {
  currentStep = 0;
  renderStep(0);
});

// 初始化加载初始状态
renderStep(0);
</script>
</body>
</html>
